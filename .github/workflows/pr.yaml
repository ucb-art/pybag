name: pybag-pr-ci

on: [push]

env:
  POETRY_VERSION: "1.2.0"
  CONDA_PATH: "conda_dir"
  CONDA_ENV_PATH: "${CONDA_PATH}/env/bag_py3d7_c"

jobs:
  tests:
    runs-on: ubuntu-20.04
    defaults:
      run:
        shell: bash -el {0}
    continue-on-error: true
    outputs:
      pytestOutput: ${{ steps.unit-tests.outputs.test }}
      mypyOutput: ${{ steps.type-checks.outputs.test }}
    strategy:
      matrix:
        python-version: ["3.7"]
    steps:
      - name: Install packages
        run: |
          sudo apt update
          sudo apt -y install \
            autoconf \
            curl \
            gcc-8 \
            g++-8 \
            git \
            libtool \
            libltdl-dev \
            pkg-config \
            make \
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: recursive
      - name: Setup conda
        uses: conda-incubator/setup-miniconda@v3.0.4
        with:
          activate-environment: bag_py3d7_c
          python-version: ${{ matrix.python-version }}
          environment-file: environment.yml
          auto-activate-base: false
          use-only-tar-bz2: true
      - name: Cache Conda env
        uses: actions/cache@v4
        with:
          path: ${{ env.CONDA }}/envs
          key:
            conda-${{ runner.os }}--${{ runner.arch }}--${{
            steps.get-date.outputs.today }}-${{
            hashFiles('environment.yml') }}-${{
            env.CACHE_NUMBER }}
        env:
          # Increase this value to reset cache if etc/example-environment.yml has not changed
          CACHE_NUMBER: 0
        id: cache
      - name: Update environment
        run:
          conda env update -n bag_py3d7_c -f
          environment.yml
        if: steps.cache.outputs.cache-hit != 'true'
      - name: Install additional dependencies
        run: |
          cd setup
          ./setup_script.sh
          cd ../
      - name: Update environment variables
        run: |
          export PYBAG_PYTHON=python
          echo ${PYBAG_PYTHON}
      - name: Try to build
        id: cpp-build
        run: |
          which python
          python setup.py build
